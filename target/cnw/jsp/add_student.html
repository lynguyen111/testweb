<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm mới sinh viên</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 50px;
        }

        .form-container {
            width: 500px;
        }

        .form-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #444;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            align-items: center;
            /* Căn giữa nội dung theo chiều dọc */
            margin-bottom: 15px;
        }

        .form-group>label {
            width: 140px;
            /* Độ rộng nhãn giống y hệt phần đăng nhập */
            font-size: 13px;
            font-weight: bold;
            color: #333;
        }

        .input-wrapper {
            flex: 1;
            /* Phần nhập liệu sẽ kéo dài chiếm hết phần còn lại */
            display: flex;
            align-items: center;
        }

        .input-wrapper input[type="text"] {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ccc;
            outline: none;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .input-wrapper input[type="text"]:focus,
        .input-wrapper select:focus {
            border-color: #66afe9;
        }

        .input-wrapper select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        /* Style cho phần Giới tính (Radio button) */
        .radio-label {
            display: flex;
            align-items: center;
            margin-right: 25px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
        }

        .radio-label input[type="radio"] {
            margin-right: 5px;
        }

        .button-group {
            display: flex;
            margin-left: 140px;
            /* Đẩy các nút sang phải để thẳng hàng với input */
            gap: 10px;
            margin-top: 10px;
        }

        .button-group button {
            background-color: #337ab7;
            /* Màu xanh của nút */
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 3px;
            font-size: 13px;
            cursor: pointer;
        }

        .button-group button:hover {
            background-color: #286090;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <div class="form-title">Thêm mới sinh viên</div>

        <form>
            <div class="form-group">
                <label>Mã SV</label>
                <div class="input-wrapper">
                    <input type="text" name="msv">
                </div>
            </div>

            <div class="form-group">
                <label>Họ tên</label>
                <div class="input-wrapper">
                    <input type="text" name="hoten">
                </div>
            </div>

            <div class="form-group">
                <label>Giới tính</label>
                <div class="input-wrapper">
                    <label class="radio-label">
                        <input type="radio" name="gioitinh"> Nam
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="gioitinh"> Nữ
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Khoa</label>
                <div class="input-wrapper">
                    <select name="khoa">
                        <option value="cntt">Khoa Công nghệ thông tin</option>
                        <option value="toan">Khoa Toán</option>
                        <option value="hoa">Khoa Hóa</option>
                        <option value="ly">Khoa Lý</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button type="submit">Thêm mới</button>
                <button type="button">Quay lại</button>
            </div>
        </form>
    </div>

</body>

</html>
